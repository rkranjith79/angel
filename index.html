<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070719" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <title>HAPPY BIRTHDAY!!</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800;900&family=Pacifico&display=swap"
    rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <style>
    :root {
      --bg-0: #05050f;
      --bg-1: #120a2e;
      --bg-2: #241056;

      --pink: #ff4d94;
      --violet: #a855f7;
      --cyan: #38bdf8;
      --gold: #ffc94a;
      --green: #34d399;

      --ink: #ffffff;
      --muted: rgba(255, 255, 255, 0.72);
      --faint: rgba(255, 255, 255, 0.5);

      --glass: rgba(255, 255, 255, 0.07);
      --glass-strong: rgba(255, 255, 255, 0.12);
      --stroke: rgba(255, 255, 255, 0.14);
      --stroke-strong: rgba(255, 255, 255, 0.28);

      --r-sm: 14px;
      --r-md: 20px;
      --r-lg: 28px;
      --r-pill: 999px;

      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);

      --shadow-card: 0 30px 70px -30px rgba(0, 0, 0, 0.85);
      --ease-pop: cubic-bezier(0.2, 0.9, 0.25, 1.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    html,
    body {
      height: 100%;
      overscroll-behavior: none;
    }

    body {
      overflow: hidden;
      background:
        radial-gradient(120% 90% at 50% -10%, var(--bg-2) 0%, transparent 55%),
        radial-gradient(100% 80% at 110% 110%, #3b0f63 0%, transparent 60%),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 70%);
      color: var(--ink);
      font-family: "Nunito", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* ---------- ambient background ---------- */

    #bg-blobs {
      position: fixed;
      inset: -20%;
      z-index: 0;
      pointer-events: none;
      filter: blur(90px) saturate(140%);
      opacity: 0.5;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      will-change: transform;
    }

    .blob.b1 {
      width: 62vw;
      height: 62vw;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.9), transparent 68%);
      top: -8%;
      left: -14%;
    }

    .blob.b2 {
      width: 74vw;
      height: 74vw;
      background: radial-gradient(circle, rgba(255, 77, 148, 0.85), transparent 68%);
      bottom: -26%;
      right: -18%;
    }

    .blob.b3 {
      width: 56vw;
      height: 56vw;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.8), transparent 68%);
      top: 28%;
      right: -6%;
    }

    /* faint grid for depth */
    #bg-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.16;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.09) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.09) 1px, transparent 1px);
      background-size: 46px 46px;
      -webkit-mask-image: radial-gradient(120% 80% at 50% 40%, #000 20%, transparent 78%);
      mask-image: radial-gradient(120% 80% at 50% 40%, #000 20%, transparent 78%);
    }

    #dust-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* ---------- floating decor (behind content) ---------- */

    #decor {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }

    .float-item {
      position: absolute;
      user-select: none;
      will-change: transform;
      opacity: 0.55;
      filter: saturate(115%) drop-shadow(0 10px 26px rgba(168, 85, 247, 0.45));
    }

    .float-item .inner {
      display: block;
      line-height: 0;
      transition: transform 0.35s var(--ease-pop);
      transform-origin: center;
    }

    .float-item .emoji {
      font-size: clamp(26px, 7.4vw, 46px);
      line-height: 1;
    }

    .float-item svg {
      width: clamp(38px, 10vw, 66px);
      height: auto;
      display: block;
    }

    .float-item.big svg {
      width: clamp(72px, 20vw, 132px);
    }

    .float-item.med svg {
      width: clamp(50px, 13vw, 88px);
    }

    /* ---------- sparkle / confetti overlay ---------- */

    #fx-canvas {
      position: fixed;
      inset: 0;
      z-index: 60;
      pointer-events: none;
    }

    /* ---------- layout ---------- */

    .stage {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        calc(var(--safe-t) + 14px)
        calc(var(--safe-r) + 16px)
        calc(var(--safe-b) + 14px)
        calc(var(--safe-l) + 16px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 460px;
      padding: clamp(22px, 6vw, 34px) clamp(18px, 5.4vw, 30px) clamp(20px, 5.4vw, 28px);
      border-radius: var(--r-lg);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.04) 45%, rgba(255, 255, 255, 0.07));
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(22px) saturate(150%);
      -webkit-backdrop-filter: blur(22px) saturate(150%);
      text-align: center;
      animation: cardIn 0.9s var(--ease-pop) both;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background:
        radial-gradient(120% 60% at 50% 0%, rgba(255, 255, 255, 0.14), transparent 60%);
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(26px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    /* kicker */
    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px;
      border-radius: var(--r-pill);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #ffe6f2;
      background: linear-gradient(135deg, rgba(255, 77, 148, 0.28), rgba(168, 85, 247, 0.28));
      border: 1px solid var(--stroke-strong);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
      animation: rise 0.7s 0.1s var(--ease-pop) both;
    }

    .kicker i {
      font-size: 12px;
      color: var(--gold);
    }

    .greeting {
      margin-top: 14px;
      font-family: "Fredoka", "Nunito", sans-serif;
      font-weight: 700;
      font-size: clamp(1.35rem, 6.4vw, 2.05rem);
      line-height: 1;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 6px 30px rgba(255, 77, 148, 0.5);
      animation: rise 0.8s 0.18s var(--ease-pop) both;
    }

    .name {
      margin-top: 6px;
      padding: 0 2px;
      font-family: "Pacifico", cursive;
      font-size: clamp(2.3rem, 12.4vw, 3.9rem);
      line-height: 1.06;
      word-break: break-word;
      background: linear-gradient(115deg, #ffffff 0%, #ffe8a8 28%, #ffc94a 50%, #ff8fb8 72%, #ffe8a8 100%);
      background-size: 220% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 8px 34px rgba(255, 201, 74, 0.35));
      animation:
        rise 0.85s 0.26s var(--ease-pop) both,
        shimmer 7s 1.2s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%,
      100% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 16px 0 14px;
      animation: rise 0.8s 0.34s var(--ease-pop) both;
    }

    .divider span {
      height: 1px;
      width: 56px;
      background: linear-gradient(90deg, transparent, var(--stroke-strong), transparent);
    }

    .divider i {
      font-size: 13px;
      color: var(--gold);
      filter: drop-shadow(0 0 10px rgba(255, 201, 74, 0.6));
    }

    .message {
      max-width: 34ch;
      margin: 0 auto;
      font-size: clamp(0.92rem, 4.1vw, 1.03rem);
      font-weight: 600;
      line-height: 1.62;
      color: var(--muted);
      text-wrap: pretty;
      animation: rise 0.8s 0.4s var(--ease-pop) both;
    }

    /* ---------- buttons ---------- */

    .cta {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 22px;
      animation: rise 0.8s 0.5s var(--ease-pop) both;
    }

    .btn {
      --mx: 50%;
      --my: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 54px;
      padding: 14px 18px;
      border: 1px solid transparent;
      border-radius: var(--r-md);
      font-family: inherit;
      font-size: 0.98rem;
      font-weight: 900;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: #fff;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.16s var(--ease-pop), box-shadow 0.2s ease, filter 0.2s ease;
      -webkit-user-select: none;
      user-select: none;
    }

    .btn i {
      font-size: 1.05rem;
      line-height: 1;
    }

    /* pointer-following sheen (works on hover + touch) */
    .btn::after,
    .chip::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      background: radial-gradient(140px 140px at var(--mx) var(--my), rgba(255, 255, 255, 0.4), transparent 70%);
    }

    .btn:hover::after,
    .btn:focus-visible::after,
    .chip:hover::after,
    .chip:focus-visible::after {
      opacity: 1;
    }

    .btn.primary {
      background: linear-gradient(135deg, #ff4d94 0%, #ff7ab8 45%, #a855f7 100%);
      box-shadow:
        0 16px 40px -16px rgba(255, 77, 148, 0.9),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.25);
    }

    .btn.secondary {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.05));
      border-color: var(--stroke-strong);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
      color: rgba(255, 255, 255, 0.94);
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.06);
    }

    .btn.primary:hover {
      box-shadow:
        0 22px 52px -18px rgba(255, 77, 148, 0.95),
        inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }

    .btn:active {
      transform: translateY(0) scale(0.975);
    }

    .btn:focus-visible,
    .chip:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.85);
      outline-offset: 3px;
    }

    /* ---------- effects dock ---------- */

    .dock-label {
      display: block;
      margin-top: 22px;
      font-size: 10.5px;
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--faint);
      animation: rise 0.8s 0.56s var(--ease-pop) both;
    }

    .dock {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
      animation: rise 0.8s 0.62s var(--ease-pop) both;
    }

    .chip {
      --mx: 50%;
      --my: 50%;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 62px;
      padding: 10px 4px;
      border: 1px solid var(--stroke);
      border-radius: var(--r-md);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.04));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
      font-family: inherit;
      color: #fff;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.16s var(--ease-pop), box-shadow 0.2s ease, border-color 0.2s ease;
      -webkit-user-select: none;
      user-select: none;
    }

    .chip i {
      font-size: 1.12rem;
      line-height: 1;
    }

    .chip span {
      font-size: 0.63rem;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }

    .chip:hover {
      transform: translateY(-2px);
      border-color: var(--stroke-strong);
      box-shadow: 0 12px 28px -16px rgba(168, 85, 247, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .chip:active {
      transform: scale(0.96);
    }

    .chip[data-tone="cyan"] i {
      color: var(--cyan);
    }

    .chip[data-tone="pink"] i {
      color: var(--pink);
    }

    .chip[data-tone="green"] i {
      color: var(--green);
    }

    .chip[data-tone="gold"] i {
      color: var(--gold);
    }

    .chip[data-tone="violet"] i {
      color: #d8b4fe;
    }

    .chip[data-tone="sky"] i {
      color: #7dd3fc;
    }

    .chip[aria-pressed="true"] {
      background: linear-gradient(180deg, rgba(255, 201, 74, 0.26), rgba(255, 77, 148, 0.14));
      border-color: rgba(255, 201, 74, 0.55);
      box-shadow: 0 0 22px -6px rgba(255, 201, 74, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    /* ---------- sound toggle ---------- */

    .sound-btn {
      position: fixed;
      top: calc(var(--safe-t) + 12px);
      right: calc(var(--safe-r) + 12px);
      z-index: 30;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: var(--r-pill);
      border: 1px solid var(--stroke);
      background: rgba(10, 6, 30, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 12px 30px -18px rgba(0, 0, 0, 0.9);
      color: #fff;
      font-size: 1.05rem;
      cursor: pointer;
      animation: rise 0.7s 0.2s var(--ease-pop) both;
      transition: transform 0.16s var(--ease-pop), color 0.2s ease;
    }

    .sound-btn:active {
      transform: scale(0.92);
    }

    .sound-btn[data-on="false"] {
      color: var(--faint);
    }

    /* One-button launch screen */
    body:not(.launched) #bg-blobs,
    body:not(.launched) #bg-grid,
    body:not(.launched) #dust-canvas,
    body:not(.launched) #decor,
    body:not(.launched) #fx-canvas,
    body:not(.launched) .stage,
    body:not(.launched) .sound-btn { display: none; }

    .launch-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      background: #03030a;
      transition: opacity 1.1s ease, visibility 1.1s ease;
    }

    body.launched .launch-screen { opacity: 0; visibility: hidden; pointer-events: none; }

    .launch-btn {
      min-width: min(78vw, 300px);
      padding: 20px 28px;
      border: 1px solid rgba(171, 142, 255, .7);
      border-radius: 999px;
      color: white;
      background: radial-gradient(circle at 30% 20%, #bb83ff, #6839d5 50%, #27105b);
      box-shadow: 0 0 24px #8b5cf6, 0 0 80px #5123a8;
      font: 900 1rem "Nunito", sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase;
      cursor: pointer;
      animation: launchPulse 2.4s ease-in-out infinite;
    }

    @keyframes launchPulse { 50% { transform: scale(1.05); box-shadow: 0 0 38px #c084fc, 0 0 110px #713be0; } }

    body.launched #bg-blobs { display: block; }
    body.launched #bg-grid { display: block; }
    body.launched #dust-canvas, body.launched #decor, body.launched #fx-canvas,
    body.launched .stage, body.launched .sound-btn { display: initial; }
    body.launched .stage { display: flex; }

    .space-status {
      margin: 12px auto 0;
      color: #c4b5fd;
      font-size: .7rem;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    body:not(.launched) .space-status { display: none; }
    body.blast-mode .card { box-shadow: 0 0 50px rgba(168,85,247,.5), var(--shadow-card), inset 0 1px 0 rgba(255,255,255,.25); }
    body.blast-mode .float-item { filter: saturate(160%) drop-shadow(0 0 18px rgba(255,201,74,.95)); }

    /* ---------- hint ---------- */

    .hint {
      margin-top: 18px;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--faint);
      animation: rise 0.8s 0.7s var(--ease-pop) both;
    }

    .hint b {
      color: rgba(255, 255, 255, 0.82);
      font-weight: 900;
    }

    /* ---------- short / landscape phones ---------- */

    @media (max-height: 720px) {
      .card {
        padding-top: 20px;
        padding-bottom: 18px;
      }

      .message {
        line-height: 1.5;
      }

      .cta {
        margin-top: 16px;
      }

      .chip {
        min-height: 56px;
      }

      .hint {
        margin-top: 12px;
      }
    }

    @media (max-height: 560px) and (orientation: landscape) {
      .stage {
        align-items: flex-start;
      }

      .card {
        max-width: 620px;
      }

      .dock {
        grid-template-columns: repeat(6, 1fr);
      }

      .hint {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .blob,
      .float-item,
      .card,
      .kicker,
      .greeting,
      .name,
      .divider,
      .message,
      .cta,
      .dock-label,
      .dock,
      .hint,
      .sound-btn {
        animation: none !important;
      }

      * {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="launch-screen" id="launchScreen">
    <button class="launch-btn" id="launchBtn" type="button"><i class="bi bi-rocket-takeoff-fill"></i> Launch Birthday Galaxy</button>
  </div>
  <div id="bg-blobs" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>
  <div id="bg-grid" aria-hidden="true"></div>

  <canvas id="dust-canvas" aria-hidden="true"></canvas>
  <div id="decor" aria-hidden="true"></div>
  <canvas id="fx-canvas" aria-hidden="true"></canvas>

  <button class="sound-btn" id="soundBtn" type="button" data-on="false" aria-label="Toggle sound"
    aria-pressed="false">
    <i class="bi bi-volume-mute-fill"></i>
  </button>

  <main class="stage">
    <section class="card">
      <span class="kicker"><i class="bi bi-balloon-heart-fill"></i> Birthday Edition</span>

      <h1 class="greeting">Happy Birthday</h1>
      <p class="name">122</p>

      <div class="divider" aria-hidden="true">
        <span></span><i class="bi bi-stars"></i><span></span>
      </div>

      <p class="message">
        Another year of main character energy unlocked! Hope this one is filled with chaos, cake, good
        grades, sick specs, bussin' vibes and the best people ever!
      </p>
      <p class="space-status" id="spaceStatus">Birthday galaxy online · music at 20%</p>

      <div class="cta">
        <button class="btn primary" type="button" id="blastBtn">
          <i class="bi bi-party-popper-fill"></i> Blast The Party
        </button>
        <button class="btn secondary" type="button" id="calmBtn">
          <i class="bi bi-moon-stars-fill"></i> Chill Mode
        </button>
      </div>

      <span class="dock-label">Tap an effect</span>

      <div class="dock">
        <button class="chip" type="button" data-action="spark" data-tone="gold" data-glow>
          <i class="bi bi-stars"></i><span>Sparkles</span>
        </button>
        <button class="chip" type="button" data-action="confetti" data-tone="pink" data-glow>
          <i class="bi bi-balloon-fill"></i><span>Confetti</span>
        </button>
        <button class="chip" type="button" data-action="balloons" data-tone="cyan" data-glow>
          <i class="bi bi-gift-fill"></i><span>Balloons</span>
        </button>
        <button class="chip" type="button" data-action="shake" data-tone="violet" data-glow>
          <i class="bi bi-lightning-charge-fill"></i><span>Shake</span>
        </button>
        <button class="chip" type="button" data-action="music" data-tone="green" data-glow>
          <i class="bi bi-music-note-beamed"></i><span>Vibe</span>
        </button>
        <button class="chip" type="button" data-action="spice" data-tone="sky" data-glow>
          <i class="bi bi-cup-hot-fill"></i><span>Spice</span>
        </button>
      </div>

      <p class="hint">Move your finger or tap anywhere for <b>glitter</b></p>
    </section>
  </main>

  <audio id="track" src="sunflower.mp3" preload="auto" loop></audio>

  <script>
    (function () {
      "use strict";

      const rand = (a, b) => a + Math.random() * (b - a);
      const randInt = (a, b) => Math.floor(rand(a, b + 1));
      const pick = (arr) => arr[randInt(0, arr.length - 1)];
      const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      let W = 0;
      let H = 0;
      let spicy = true;
      let soundOn = false;

      /* ==================== canvases ==================== */

      const dustCv = document.getElementById("dust-canvas");
      const dustCtx = dustCv.getContext("2d");
      const fxCv = document.getElementById("fx-canvas");
      const fx = fxCv.getContext("2d");

      let dpr = 1;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;

        [dustCv, fxCv].forEach((cv) => {
          cv.width = Math.round(W * dpr);
          cv.height = Math.round(H * dpr);
          cv.style.width = W + "px";
          cv.style.height = H + "px";
        });

        dustCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        fx.setTransform(dpr, 0, 0, dpr, 0, 0);

        seedDust();
        layoutDecor();
      }

      /* ==================== glow sprite ==================== */

      const SPARK_COLORS = ["#ffffff", "#fff3c4", "#ffc9e0", "#c8e6ff", "#e2ccff"];

      const glowSprites = SPARK_COLORS.map((color) => {
        const size = 64;
        const c = document.createElement("canvas");
        c.width = c.height = size;
        const g = c.getContext("2d");
        const grd = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
        grd.addColorStop(0, color);
        grd.addColorStop(0.28, hexToRgba(color, 0.42));
        grd.addColorStop(1, hexToRgba(color, 0));
        g.fillStyle = grd;
        g.fillRect(0, 0, size, size);
        return c;
      });

      function hexToRgba(hex, a) {
        const n = parseInt(hex.slice(1), 16);
        return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
      }

      /* ==================== particles ==================== */

      let sparks = [];
      let confetti = [];
      let dust = [];

      const MAX_SPARKS = 320;
      const MAX_CONFETTI = 420;
      const CONFETTI_COLORS = ["#ff4d94", "#a855f7", "#38bdf8", "#34d399", "#ffc94a", "#ffffff"];

      function addSpark(x, y, opts) {
        const o = opts || {};
        const life = o.life || randInt(22, 52);
        const size = o.size || rand(3, 8);
        sparks.push({
          x: x,
          y: y,
          vx: o.vx !== undefined ? o.vx : rand(-0.5, 0.5),
          vy: o.vy !== undefined ? o.vy : rand(-0.6, 0.1),
          life: life,
          max: life,
          size: size,
          rot: rand(0, Math.PI * 2),
          vr: rand(-0.06, 0.06),
          color: o.color || pick(SPARK_COLORS),
          glow: o.glow !== undefined ? o.glow : 1,
          drag: o.drag !== undefined ? o.drag : 0.94
        });
        if (sparks.length > MAX_SPARKS) sparks.splice(0, sparks.length - MAX_SPARKS);
      }

      /* radial burst — used on tap / click */
      function sparkBurst(x, y, count, power) {
        const n = reduceMotion ? Math.min(count, 8) : count;
        for (let i = 0; i < n; i++) {
          const a = (Math.PI * 2 * i) / n + rand(-0.25, 0.25);
          const sp = rand(0.8, 2.4) * (power || 1);
          addSpark(x, y, {
            vx: Math.cos(a) * sp,
            vy: Math.sin(a) * sp - 0.4,
            size: rand(4, 11),
            life: randInt(28, 60),
            drag: 0.93
          });
        }
      }

      /* trail burst — used on hover of controls */
      function sparkleAt(el, count) {
        const r = el.getBoundingClientRect();
        const x = r.left + r.width * rand(0.2, 0.8);
        const y = r.top + r.height * rand(0.25, 0.75);
        const n = reduceMotion ? 3 : count || 9;
        for (let i = 0; i < n; i++) {
          const a = rand(0, Math.PI * 2);
          const sp = rand(0.3, 1.5);
          addSpark(x, y, {
            vx: Math.cos(a) * sp,
            vy: Math.sin(a) * sp - 0.5,
            size: rand(3.5, 9),
            life: randInt(24, 48)
          });
        }
      }

      /* directionless sprinkle — used by effects */
      function sprinkle(x, y, count, spread) {
        const n = reduceMotion ? Math.min(count, 10) : count;
        for (let i = 0; i < n; i++) {
          addSpark(x + rand(-spread, spread), y + rand(-spread * 0.4, spread * 0.4), {
            vx: rand(-1, 1),
            vy: rand(-1.6, 0.3),
            size: rand(3, 9),
            life: randInt(30, 62)
          });
        }
      }

      function confettiBurst(x, y, count, angle, spread) {
        const n = reduceMotion ? Math.min(count, 24) : count;
        const dir = angle === undefined ? -Math.PI / 2 : angle;
        const arc = spread === undefined ? Math.PI : spread;
        for (let i = 0; i < n; i++) {
          const a = dir + rand(-arc / 2, arc / 2);
          const sp = rand(5, 13);
          confetti.push({
            x: x,
            y: y,
            vx: Math.cos(a) * sp,
            vy: Math.sin(a) * sp,
            rot: rand(0, Math.PI * 2),
            vr: rand(-0.25, 0.25),
            spin: rand(0, Math.PI * 2),
            vs: rand(0.12, 0.28),
            w: rand(6, 11),
            h: rand(9, 15),
            g: rand(0.14, 0.3),
            life: randInt(90, 190),
            color: pick(CONFETTI_COLORS),
            ribbon: Math.random() > 0.45
          });
        }
        if (confetti.length > MAX_CONFETTI) confetti.splice(0, confetti.length - MAX_CONFETTI);
      }

      /* ==================== ambient dust (back layer) ==================== */

      function seedDust() {
        const count = Math.round(clamp((W * H) / 26000, 22, 60));
        dust = [];
        for (let i = 0; i < count; i++) {
          dust.push({
            x: rand(0, W),
            y: rand(0, H),
            r: rand(0.7, 2.3),
            vx: rand(-0.12, 0.12),
            vy: rand(-0.22, -0.04),
            phase: rand(0, Math.PI * 2),
            speed: rand(0.015, 0.045),
            color: pick(SPARK_COLORS)
          });
        }
      }

      function updateDust() {
        for (const d of dust) {
          d.x += d.vx;
          d.y += d.vy;
          d.phase += d.speed;
          if (d.y < -6) {
            d.y = H + 6;
            d.x = rand(0, W);
          }
          if (d.x < -6) d.x = W + 6;
          if (d.x > W + 6) d.x = -6;
        }
      }

      function drawDust() {
        dustCtx.clearRect(0, 0, W, H);
        dustCtx.globalCompositeOperation = "lighter";
        for (const d of dust) {
          const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(d.phase));
          dustCtx.globalAlpha = tw * 0.55;
          dustCtx.fillStyle = d.color;
          dustCtx.beginPath();
          dustCtx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
          dustCtx.fill();
        }
        dustCtx.globalAlpha = 1;
        dustCtx.globalCompositeOperation = "source-over";
      }

      /* ==================== sparkles (front layer) ==================== */

      function drawStar(x, y, r, rot, color, alpha) {
        fx.save();
        fx.translate(x, y);
        fx.rotate(rot);
        fx.fillStyle = color;
        fx.globalAlpha = alpha;
        fx.beginPath();
        for (let i = 0; i < 4; i++) {
          const a = (Math.PI / 2) * i;
          const c = Math.cos(a);
          const s = Math.sin(a);
          fx.moveTo(0, 0);
          fx.lineTo(c * r * 0.3 - s * r * 0.14, s * r * 0.3 + c * r * 0.14);
          fx.lineTo(c * r, s * r);
          fx.lineTo(c * r * 0.3 + s * r * 0.14, s * r * 0.3 - c * r * 0.14);
          fx.closePath();
        }
        fx.fill();
        fx.restore();
      }

      function updateSparks() {
        const speed = spicy ? 1.25 : 0.7;
        for (let i = sparks.length - 1; i >= 0; i--) {
          const s = sparks[i];
          s.vx *= s.drag;
          s.vy = s.vy * s.drag + 0.028 * speed;
          s.x += s.vx * speed;
          s.y += s.vy * speed;
          s.rot += s.vr;
          s.life--;
          if (s.life <= 0) sparks.splice(i, 1);
        }
      }

      function drawSparks() {
        fx.globalCompositeOperation = "lighter";
        for (const s of sparks) {
          const t = s.life / s.max;
          const alpha = Math.min(1, t * 1.8);
          const pop = 0.6 + 0.4 * Math.sin(Math.min(1, (1 - t) * Math.PI));
          const r = s.size * pop;
          const sprite = glowSprites[SPARK_COLORS.indexOf(s.color)] || glowSprites[0];
          fx.globalAlpha = alpha * 0.55 * s.glow;
          fx.drawImage(sprite, s.x - r * 2.6, s.y - r * 2.6, r * 5.2, r * 5.2);
          drawStar(s.x, s.y, r, s.rot, s.color, alpha);
        }
        fx.globalCompositeOperation = "source-over";
        fx.globalAlpha = 1;
      }

      function updateConfetti() {
        const g = spicy ? 1.1 : 0.85;
        for (let i = confetti.length - 1; i >= 0; i--) {
          const p = confetti[i];
          p.vy += p.g * g;
          p.vx *= 0.995;
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.vr;
          p.spin += p.vs;
          p.life--;
          if (p.life <= 0 || p.y > H + 40) confetti.splice(i, 1);
        }
      }

      function drawConfetti() {
        for (const p of confetti) {
          const alpha = Math.min(1, p.life / 45);
          fx.save();
          fx.translate(p.x, p.y);
          fx.rotate(p.rot);
          fx.globalAlpha = alpha;
          fx.fillStyle = p.color;
          const sx = Math.cos(p.spin);
          fx.scale(Math.max(0.16, Math.abs(sx)), 1);
          if (p.ribbon) {
            fx.beginPath();
            fx.ellipse(0, 0, p.w * 0.5, p.h * 0.42, 0, 0, Math.PI * 2);
            fx.fill();
          } else {
            fx.beginPath();
            fx.roundRect(-p.w / 2, -p.h / 2, p.w, p.h, 2);
            fx.fill();
          }
          fx.restore();
        }
        fx.globalAlpha = 1;
      }

      /* ==================== cursor trail ==================== */

      const trail = { x: -999, y: -999, last: 0 };

      function pushTrail(x, y, now) {
        if (reduceMotion) return;
        const dx = x - trail.x;
        const dy = y - trail.y;
        const dist = Math.hypot(dx, dy);
        const dt = now - trail.last;

        if (trail.x < -500 || dist < 7) {
          trail.x = x;
          trail.y = y;
          trail.last = now;
          return;
        }

        /* density scales with speed, capped for perf */
        const steps = clamp(Math.round(dist / 16), 1, 5);
        for (let i = 1; i <= steps; i++) {
          const t = i / steps;
          addSpark(trail.x + dx * t, trail.y + dy * t, {
            vx: -dx * 0.035 + rand(-0.25, 0.25),
            vy: -dy * 0.035 + rand(-0.45, -0.05),
            size: rand(3, 7.5),
            life: randInt(20, 44),
            drag: 0.93
          });
        }

        /* fast swipes leave a confetti fleck behind */
        if (dist > 90 && dt < 60 && Math.random() < 0.4) {
          confettiBurst(trail.x + dx * 0.5, trail.y + dy * 0.5, 3, 0, Math.PI * 2);
        }

        trail.x = x;
        trail.y = y;
        trail.last = now;
      }

      /* ==================== decor ==================== */

      const decorLayer = document.getElementById("decor");
      let floaters = [];

      const DECOR = [
        { key: "candle", size: "" },
        { key: "glasses", size: "med" },
        { key: "bus", size: "big" },
        { key: "cake", size: "" },
        { key: "bag", size: "" },
        { key: "notes", size: "med" },
        { key: "star", size: "" },
        { key: "balloon", size: "" },
        { key: "bulb", size: "" }
      ];

      function svgFor(key) {
        switch (key) {
          case "glasses":
            return `<svg viewBox="0 0 180 96" width="180" height="96">
              <circle cx="50" cy="52" r="34" fill="none" stroke="#fff" stroke-width="9"/>
              <circle cx="130" cy="52" r="34" fill="none" stroke="#fff" stroke-width="9"/>
              <path d="M84 50 H96" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
              <path d="M12 42 Q40 24 66 40" stroke="#38bdf8" stroke-width="7" fill="none" stroke-linecap="round" opacity=".7"/>
            </svg>`;
          case "candle":
            return `<svg viewBox="0 0 40 84" width="40" height="84">
              <defs>
                <linearGradient id="cwax" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#d8e2f0"/>
                </linearGradient>
                <radialGradient id="cflame" cx="50%" cy="72%" r="70%">
                  <stop offset="0%" stop-color="#fffbe0"/>
                  <stop offset="58%" stop-color="#ffc94a"/>
                  <stop offset="100%" stop-color="#ff4d94"/>
                </radialGradient>
              </defs>
              <rect x="13" y="36" width="14" height="44" rx="4" fill="url(#cwax)"/>
              <ellipse cx="20" cy="36" rx="11" ry="5" fill="#ffe8a8"/>
              <path d="M20 24 C23 17 27 12 20 4 C13 12 17 17 20 24 Z" fill="url(#cflame)"/>
            </svg>`;
          case "bus":
            return `<svg viewBox="0 0 320 130" width="320" height="130">
              <rect x="20" y="42" width="240" height="58" rx="13" fill="#38bdf8"/>
              <rect x="30" y="52" width="118" height="38" rx="7" fill="#0b1030" opacity=".85"/>
              <rect x="158" y="52" width="88" height="38" rx="7" fill="#fff" opacity=".92"/>
              <circle cx="70" cy="108" r="15" fill="#0b1030"/><circle cx="70" cy="108" r="7" fill="#e5e7eb"/>
              <circle cx="212" cy="108" r="15" fill="#0b1030"/><circle cx="212" cy="108" r="7" fill="#e5e7eb"/>
              <rect x="260" y="60" width="40" height="40" rx="10" fill="#ff4d94"/>
              <polygon points="270,70 291,80 270,90" fill="#fff"/>
              <rect x="40" y="38" width="80" height="7" rx="3.5" fill="#d8b4fe"/>
            </svg>`;
          case "cake":
            return `<svg viewBox="0 0 84 84" width="84" height="84">
              <ellipse cx="42" cy="50" rx="29" ry="15" fill="#f5dcb0"/>
              <rect x="14" y="44" width="56" height="20" rx="6" fill="#d8b4fe"/>
              <path d="M20 44 C20 31 29 22 42 22 C55 22 64 31 64 44 Z" fill="#fff1f8"/>
              <circle cx="33" cy="33" r="3" fill="#ff4d94"/>
              <circle cx="50" cy="30" r="2.4" fill="#38bdf8"/>
              <circle cx="42" cy="26" r="2.8" fill="#34d399"/>
              <rect x="38" y="8" width="8" height="14" rx="3" fill="#fff3bf"/>
              <path d="M42 6 C44 8 46 10 42 18 C38 10 40 8 42 6 Z" fill="#ffc94a"/>
            </svg>`;
          case "bag":
            return `<span class="emoji">🎒</span>`;
          case "notes":
            return `<span class="emoji">📚</span>`;
          case "star":
            return `<span class="emoji">⭐</span>`;
          case "balloon":
            return `<span class="emoji">🎈</span>`;
          case "bulb":
            return `<span class="emoji">💡</span>`;
          default:
            return `<span class="emoji">🎉</span>`;
        }
      }

      function buildFloater(key, sizeClass) {
        const el = document.createElement("div");
        el.className = "float-item" + (sizeClass ? " " + sizeClass : "");
        el.innerHTML = `<span class="inner">${svgFor(key)}</span>`;
        decorLayer.appendChild(el);
        return el;
      }

      /* keep decor away from the centre so text stays readable */
      function layoutDecor() {
        floaters.forEach((f) => decorLayer.removeChild(f.el));
        floaters = [];

        const count = W < 420 ? 9 : 13;
        const list = [];
        for (let i = 0; i < count; i++) list.push(DECOR[i % DECOR.length]);

        list.forEach((d, i) => {
          const el = buildFloater(d.key, d.size);
          const left = i % 2 === 0;
          const band = W < 420 ? 0.2 : 0.26;
          const baseX = left
            ? rand(-0.02, band) * W
            : rand(1 - band, 1.02) * W;
          const baseY = (0.06 + 0.88 * ((i / count) + rand(-0.06, 0.06))) * H;

          floaters.push({
            el: el,
            baseX: baseX,
            baseY: baseY,
            amp: rand(6, 16),
            t: rand(0, Math.PI * 2),
            speed: rand(0.008, 0.016),
            rotAmp: rand(0.3, 1.4),
            depth: left ? rand(6, 18) : rand(-18, -6),
            o: 0,
            to: rand(0.34, 0.62)
          });
        });
      }

      let px = 0;
      let py = 0;

      function updateDecor() {
        for (const f of floaters) {
          f.t += f.speed * (spicy ? 1.5 : 0.9);
          f.o += (f.to - f.o) * 0.03;
          const dx = Math.sin(f.t) * f.amp;
          const dy = Math.cos(f.t * 0.8) * f.amp * 0.55;
          const rot = Math.sin(f.t * 0.5) * f.rotAmp;
          f.el.style.opacity = f.o.toFixed(3);
          f.el.style.transform =
            `translate3d(${(f.baseX + dx + px * f.depth).toFixed(2)}px, ` +
            `${(f.baseY + dy + py * f.depth).toFixed(2)}px, 0) rotate(${rot.toFixed(2)}deg)`;
        }
      }

      /* ==================== background blobs ==================== */

      const blobs = [].slice.call(document.querySelectorAll(".blob"));
      let bt = 0;

      function updateBlobs() {
        bt += 0.008 * (spicy ? 1.3 : 0.7);
        blobs[0].style.transform =
          `translate(${(Math.sin(bt) * 22).toFixed(1)}px, ${(Math.cos(bt * 0.8) * 18).toFixed(1)}px) scale(${(1 + Math.sin(bt * 0.6) * 0.09).toFixed(3)})`;
        blobs[1].style.transform =
          `translate(${(Math.cos(bt * 0.7) * -26).toFixed(1)}px, ${(Math.sin(bt * 0.9) * -22).toFixed(1)}px) scale(${(1 + Math.cos(bt * 0.5) * 0.11).toFixed(3)})`;
        blobs[2].style.transform =
          `translate(${(Math.sin(bt * 0.9) * 20).toFixed(1)}px, ${(Math.cos(bt * 0.6) * 24).toFixed(1)}px) scale(${(1 + Math.sin(bt * 0.7) * 0.1).toFixed(3)})`;
      }

      /* ==================== main loop ==================== */

      let ambientAt = 0;

      function frame(now) {
        fx.clearRect(0, 0, W, H);

        if (px !== 0 || py !== 0) {
          px *= 0.92;
          py *= 0.92;
          if (Math.abs(px) < 0.01) px = 0;
          if (Math.abs(py) < 0.01) py = 0;
        }

        updateDust();
        drawDust();
        updateSparks();
        drawSparks();
        updateConfetti();
        drawConfetti();
        updateDecor();
        updateBlobs();

        /* occasional ambient twinkle so the screen is never static */
        if (!reduceMotion && now > ambientAt) {
          ambientAt = now + rand(spicy ? 260 : 900, spicy ? 900 : 2200);
          const a = rand(0, Math.PI * 2);
          addSpark(W / 2 + Math.cos(a) * W * 0.42, H / 2 + Math.sin(a) * H * 0.42, {
            vx: rand(-0.2, 0.2),
            vy: rand(-0.5, -0.1),
            size: rand(3, 7),
            life: randInt(30, 60)
          });
        }

        requestAnimationFrame(frame);
      }

      /* ==================== audio ==================== */

      const track = document.getElementById("track");
      const soundBtn = document.getElementById("soundBtn");
      let audioCtx = null;
      let filter = null;
      let gain = null;

      function ensureAudio() {
        if (audioCtx) {
          if (audioCtx.state === "suspended") audioCtx.resume();
          return true;
        }
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        try {
          audioCtx = new AC();
          const src = audioCtx.createMediaElementSource(track);
          filter = audioCtx.createBiquadFilter();
          filter.type = "lowpass";
          filter.frequency.value = spicy ? 20000 : 1100;
          gain = audioCtx.createGain();
          gain.gain.value = 0.9;
          src.connect(filter).connect(gain).connect(audioCtx.destination);
        } catch (e) {
          audioCtx = null;
          return false;
        }
        return true;
      }

      function setMood(on) {
        if (!audioCtx) return;
        const t = audioCtx.currentTime;
        if (filter) {
          filter.frequency.setTargetAtTime(on ? 20000 : 1100, t, 0.2);
          filter.Q.setTargetAtTime(on ? 0.7 : 1.6, t, 0.2);
        }
        if (gain) gain.gain.setTargetAtTime(on ? 0.9 : 0.45, t, 0.25);
      }

      function play() {
        if (!ensureAudio()) return false;
        track.volume = 0.9;
        const p = track.play();
        if (p && p.catch) p.catch(() => {});
        return true;
      }

      function pause() {
        track.pause();
        return false;
      }

      function setSoundUI(on) {
        soundOn = on;
        soundBtn.dataset.on = String(on);
        soundBtn.setAttribute("aria-pressed", String(on));
        soundBtn.innerHTML = on
          ? '<i class="bi bi-volume-up-fill"></i>'
          : '<i class="bi bi-volume-mute-fill"></i>';
        if (window.navigator.vibrate) navigator.vibrate(on ? 12 : 8);
      }

      soundBtn.addEventListener("click", function () {
        const on = track.paused ? play() : pause();
        setSoundUI(on);
      });

      /* ==================== actions ==================== */

      function buzz(ms) {
        if (window.navigator.vibrate) navigator.vibrate(ms || 10);
      }

      function blastParty() {
        spicy = true;
        setMood(true);
        setSpiceChip();
        if (track.paused) setSoundUI(play());
        confettiBurst(W / 2, H * 0.16, 160);
        confettiBurst(W * 0.05, H, 70, -Math.PI / 3, Math.PI / 3);
        confettiBurst(W * 0.95, H, 70, -Math.PI + Math.PI / 3, Math.PI / 3);
        for (let i = 0; i < 14; i++) {
          setTimeout(() => sprinkle(rand(0, W), rand(0, H * 0.5), 10, 40), i * 70);
        }
        sparkBurst(W / 2, H * 0.4, 40, 1.6);
        buzz([12, 40, 18]);
        shake();
      }

      function chillMode() {
        spicy = false;
        setMood(false);
        setSpiceChip();
        confettiBurst(W / 2, H * 0.22, 40);
        sprinkle(W / 2, H * 0.45, 16, 90);
        buzz(8);
      }

      function shake() {
        document.body.animate(
          [
            { transform: "translate3d(0,0,0)" },
            { transform: "translate3d(-3px,2px,0)" },
            { transform: "translate3d(3px,-2px,0)" },
            { transform: "translate3d(-2px,2px,0)" },
            { transform: "translate3d(2px,-2px,0)" },
            { transform: "translate3d(0,0,0)" }
          ],
          { duration: 260, iterations: 1, easing: "ease-in-out" }
        );
      }

      function addBalloons(n) {
        for (let i = 0; i < (n || 5); i++) {
          const left = Math.random() < 0.5;
          const el = buildFloater("balloon", "");
          const baseX = left ? rand(0.02, 0.28) * W : rand(0.72, 0.98) * W;
          const baseY = rand(0.1, 0.9) * H;
          floaters.push({
            el: el,
            baseX: baseX,
            baseY: baseY,
            amp: rand(8, 20),
            t: rand(0, Math.PI * 2),
            speed: rand(0.01, 0.02),
            rotAmp: rand(3, 8),
            depth: left ? rand(8, 20) : rand(-20, -8),
            o: 0,
            to: 0.6
          });
          sparkleAt(el, 6);
        }
        if (floaters.length > 26) {
          const drop = floaters.splice(0, floaters.length - 26);
          drop.forEach((f) => decorLayer.removeChild(f.el));
        }
      }

      const spiceChip = document.querySelector('.chip[data-action="spice"]');
      function setSpiceChip() {
        spiceChip.setAttribute("aria-pressed", String(spicy));
        spiceChip.querySelector("span").textContent = spicy ? "Spice" : "Chill";
      }

      const ACTIONS = {
        spark: function () {
          sprinkle(W / 2, H * 0.14, 70, W * 0.45);
          buzz(8);
        },
        confetti: function () {
          confettiBurst(W / 2, H * 0.1, 130);
          confettiBurst(W * 0.1, H, 60, -Math.PI / 2.6, Math.PI / 4);
          confettiBurst(W * 0.9, H, 60, -Math.PI + Math.PI / 2.6, Math.PI / 4);
          buzz(14);
        },
        balloons: function () {
          addBalloons(5);
          buzz(10);
        },
        shake: function () {
          spicy = true;
          setMood(true);
          setSpiceChip();
          shake();
          sparkBurst(W / 2, H * 0.5, 34, 1.5);
          confettiBurst(W / 2, H * 0.18, 70);
          buzz([10, 30, 14]);
        },
        music: function () {
          const on = track.paused ? play() : pause();
          setSoundUI(on);
        },
        spice: function () {
          spicy = !spicy;
          setMood(spicy);
          setSpiceChip();
          if (spicy) {
            confettiBurst(W / 2, H * 0.14, 90);
            sprinkle(W / 2, H * 0.4, 26, W * 0.4);
          } else {
            sprinkle(W / 2, H * 0.4, 12, W * 0.4);
          }
          buzz(8);
        }
      };

      document.getElementById("blastBtn").addEventListener("click", blastParty);
      document.getElementById("calmBtn").addEventListener("click", chillMode);

      document.querySelectorAll(".chip[data-action]").forEach(function (chip) {
        chip.addEventListener("click", function () {
          sparkleAt(chip, 12);
          const fn = ACTIONS[chip.dataset.action];
          if (fn) fn();
        });
      });

      /* hover / cursor-entry sparkle on every interactive surface */
      document.querySelectorAll("[data-glow], .btn").forEach(function (el) {
        el.addEventListener("pointerenter", function () {
          sparkleAt(el, el.classList.contains("btn") ? 12 : 7);
        });
        el.addEventListener("pointermove", function (e) {
          const r = el.getBoundingClientRect();
          el.style.setProperty("--mx", ((e.clientX - r.left) / r.width) * 100 + "%");
          el.style.setProperty("--my", ((e.clientY - r.top) / r.height) * 100 + "%");
        });
        el.addEventListener("pointerleave", function () {
          sparkleAt(el, 4);
        });
      });

      /* ==================== global input ==================== */

      function setParallax(x, y) {
        px = (x / W - 0.5) * 2;
        py = (y / H - 0.5) * 2;
      }

      window.addEventListener(
        "pointermove",
        function (e) {
          const now = performance.now();
          pushTrail(e.clientX, e.clientY, now);
          setParallax(e.clientX, e.clientY);
        },
        { passive: true }
      );

      window.addEventListener(
        "pointerdown",
        function (e) {
          setParallax(e.clientX, e.clientY);
          sparkBurst(e.clientX, e.clientY, 20, 1);
          if (Math.random() < 0.55) confettiBurst(e.clientX, e.clientY, 12, 0, Math.PI * 2);
          buzz(9);
        },
        { passive: true }
      );

      window.addEventListener("pointerleave", function () {
        px = 0;
        py = 0;
        trail.x = -999;
        trail.y = -999;
      });

      /* desktop keyboard support */
      window.addEventListener("keydown", function (e) {
        if (e.key === " " || e.key === "Enter") {
          if (document.activeElement && document.activeElement !== document.body) return;
          e.preventDefault();
          blastParty();
        }
      });

      /* ==================== boot ==================== */

      window.addEventListener("resize", resize);
      window.addEventListener("orientationchange", function () {
        setTimeout(resize, 220);
      });

      resize();
      setSpiceChip();
      requestAnimationFrame(frame);

      setTimeout(function () {
        confettiBurst(W / 2, H * 0.12, 70);
        sparkleAt(document.querySelector(".card"), 26);
      }, 420);
    })();
  </script>
</body>

</html>
